providers:
  - id: noaa-weather
    type: mcp_http
    base_url: https://weather-mcp.tomschenkjr.net
    description: "NOAA weather forecasts and alerts for the Chicago area"
    geometry:
      strategy: nws_zone
      zone_prefix: forecast
      default_zone: "ILZ104"   # Chicago / Cook County forecast zone
    display:
      color: "#5588CC"
      fillColor: "#AACCEE"
      opacity: 50
    tools:
      - name: get_forecast
        description: "7-day weather forecast for a lat/lon location"
        inputs:
          latitude: {type: number, description: "Decimal latitude"}
          longitude: {type: number, description: "Decimal longitude"}
      - name: get_alerts
        description: "Active NWS weather alerts and warnings for Chicago"
        inputs: {}
      - name: get_hourly_forecast
        description: "Hour-by-hour forecast for the next 48 hours"
        inputs:
          latitude: {type: number}
          longitude: {type: number}

  - id: chicago-marine-knowledge
    type: mcp_http
    base_url: https://chicago-marine-knowledge-mcp.tomschenkjr.net
    description: "Chicago Marine Knowledge sailing conditions, buoy data, beach sensors, NOAA marine forecasts, and alerts"
    geometry:
      strategy: nws_zone
      zone_prefix: marine
      default_zone: "LMZ742"   # Chicago nearshore Lake Michigan zone
      # Combined Chicago shoreline nearshore zones (rendered as one shape)
      zones: ["LMZ741", "LMZ742"]
    display:
      color: "#006699"
      fillColor: "#66AACC"
      opacity: 50
    tools:
      - name: get_sailing_conditions
        description: "Lakewide Chicago sailing conditions — NOAA marine forecast/alerts plus notable wind/wave observations"
        inputs:
          area_id: {type: string, description: "Sailing area. Supported value: chicago_lakefront", default: "chicago_lakefront"}
          response_profile: {type: string, description: "Response detail profile", default: "compact_llm"}
      - name: get_marine_conditions
        description: "Source-grounded marine conditions for a specific Chicago lakefront place"
        inputs:
          place_id: {type: string, description: "Place id: monroe_harbor, oak_street_beach, foster_beach, or 63rd_street_beach", default: "monroe_harbor"}
          response_profile: {type: string, description: "Response detail profile", default: "compact_llm"}
      - name: get_marine_context
        description: "Detailed source-grounded marine context (forecast, water, weather sensors) for a lakefront place"
        inputs:
          place_id: {type: string, description: "Place id: monroe_harbor, oak_street_beach, foster_beach, or 63rd_street_beach", default: "monroe_harbor"}
          response_profile: {type: string, description: "Response detail profile", default: "compact_llm"}
