  # Proximity-only datasets: used as spatial anchors in "near X" queries but
  # not exposed as primary queryable layers in the UI.
  - id: "schools"
    displayName: "CPS Schools"
    proximity_only: true
    socrata_domain: "data.cityofchicago.org"
    socrata_dataset_id: "kh4r-387c"
    lat_field: "school_latitude"
    lon_field: "school_longitude"
    proximity:
      name_field: "long_name"
      limit: 700
      aliases:
        - "schools"
        - "school"
        - "CPS schools"
        - "Chicago schools"
        - "public schools"
