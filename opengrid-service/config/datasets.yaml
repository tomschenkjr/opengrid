datasets:
  - id: "crimes"
    displayName: "Crimes"
    socrata_domain: "data.cityofchicago.org"
    socrata_dataset_id: "ijzp-q8t2"
    lat_field: "latitude"
    lon_field: "longitude"
    geographic_columns:
      community_area: "community_area"
      ward: "ward"
      zip: null
      police_district: "district"
    proximity:
      name_field: "primary_type"
      limit: 2000
      aliases:
        - "crimes"
        - "crime locations"
        - "crime incidents"
        - "crime scenes"
    quickSearch:
      enable: true
      triggerWord: "crime"
      triggerAlias: "cr"
      defaultMax: 200
      defaultSort: '{"date": -1}'
    options:
      rendition:
        icon: "default"
        color: "#CC0000"
        fillColor: "#FF6666"
        opacity: 85
        size: 6
    columns:
      - id: "date"
        displayName: "Date"
        dataType: "date"
        filter: true
        popup: true
        list: true
        sortOrder: 1
        format: "MM/DD/YYYY hh:mm:ss aa"
      - id: "primary_type"
        displayName: "Crime Type"
        dataType: "string"
        filter: true
        popup: true
        list: true
        sortOrder: 2
        quickSearch: true
      - id: "description"
        displayName: "Description"
        dataType: "string"
        filter: true
        popup: true
        list: true
        sortOrder: 3
      - id: "block"
        displayName: "Block"
        dataType: "string"
        popup: true
        list: true
        sortOrder: 4
      - id: "location_description"
        displayName: "Location"
        dataType: "string"
        filter: true
        popup: true
        list: true
        sortOrder: 5
      - id: "arrest"
        displayName: "Arrest"
        dataType: "string"
        filter: true
        popup: true
        list: true
        sortOrder: 6

